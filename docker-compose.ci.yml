services:
  app:
    container_name: hyperf-bank-api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: testing
    ports:
      - "9501:9501"
    environment:
      - APP_ENV=testing
      - SCAN_CACHEABLE=false
      - DB_DRIVER=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=testing
      - DB_USERNAME=testing
      - DB_PASSWORD=testing
      - DB_CHARSET=utf8mb4
      - DB_COLLATION=utf8mb4_unicode_ci
      - DB_PREFIX=
      - REDIS_HOST=redis
      - REDIS_AUTH=testing
      - REDIS_PORT=6379
      - REDIS_DB=0
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - RABBITMQ_VHOST=/
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hyperf-bank-api

  mysql:
    container_name: hyperf-bank-mysql
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: testing
      MYSQL_DATABASE: testing
      MYSQL_USER: testing
      MYSQL_PASSWORD: testing
      TZ: America/Sao_Paulo
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hyperf-bank-api

  redis:
    container_name: hyperf-bank-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass testing
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "testing", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hyperf-bank-api

  rabbitmq:
    container_name: hyperf-bank-rabbitmq
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hyperf-bank-api

networks:
  hyperf-bank-api:
    driver: bridge
