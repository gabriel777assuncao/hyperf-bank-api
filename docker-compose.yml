services:
  app:
    container_name: hyperf-bank-api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: ${APP_ENV:-dev}
    volumes:
      - .:/opt/www
    ports:
      - "${APP_PORT:-9501}:9501"
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - SCAN_CACHEABLE=false
    command: ["server:watch"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hyperf-bank-api

  mysql:
    container_name: hyperf-bank-mysql
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-hyperf}
      MYSQL_USER: ${DB_USERNAME:-hyperf}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      TZ: America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hyperf-bank-api

  redis:
    container_name: hyperf-bank-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_AUTH:-secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_AUTH:-secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hyperf-bank-api

  rabbitmq:
    container_name: hyperf-bank-rabbitmq
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hyperf}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-secret}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hyperf-bank-api

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:

networks:
  hyperf-bank-api:
    driver: bridge
